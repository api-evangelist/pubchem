apis:
- name: PubChem PUG View API
  description: >-
    The PUG View API provides access to the full structured compound and substance pages as seen on the
    PubChem website, organized as hierarchical sections covering names, structures, physical and chemical
    properties, safety data, pharmacology, biological activities, toxicology, literature references, and
    more.
  humanURL: https://pubchem.ncbi.nlm.nih.gov/docs/pug-view
  baseURL: https://pubchem.ncbi.nlm.nih.gov/rest/pug_view
  tags:
  - Compound Data
  - Safety Data
  - Pharmacology
  - Toxicology
  - Structured Data
  properties:
  - type: Documentation
    url: https://pubchem.ncbi.nlm.nih.gov/docs/pug-view
  contact:
  - FN: PubChem Help Desk
    email: pubchem-help@ncbi.nlm.nih.gov
  operations:
  - summary: Get full compound data page
    method: GET
    path: /data/compound/{cid}/JSON
    description: >-
      Retrieve all structured data for a compound as seen on its PubChem compound page, organized in hierarchical
      sections.
  - summary: Get compound data section
    method: GET
    path: /data/compound/{cid}/JSON
    description: >-
      Retrieve a specific section of a compound data page using the heading parameter (e.g., Safety+and+Hazards,
      Pharmacology+and+Biochemistry, Chemical+and+Physical+Properties).
  - summary: Get full substance data page
    method: GET
    path: /data/substance/{sid}/JSON
    description: Retrieve all structured data for a substance record in hierarchical section format.
  - summary: Get annotations by heading
    method: GET
    path: /annotations/heading/{heading}/JSON
    description: >-
      Retrieve annotations across all compounds for a specific data heading (e.g., Boiling+Point, LogP,
      Melting+Point).
  - summary: Get data in XML format
    method: GET
    path: /data/compound/{cid}/XML
    description: Retrieve full compound structured data in XML format.
  - summary: Get data in ASNT format
    method: GET
    path: /data/compound/{cid}/ASNT
    description: Retrieve full compound structured data in ASN.1 text format for programmatic parsing.
- name: PubChem PUG SOAP API
  description: >-
    Legacy SOAP/XML web service interface for PubChem providing structure search, identity search, and
    chemical standardization capabilities. Supports submitting queries and retrieving results in ASN.1,
    XML, and SDF formats.
  humanURL: https://pubchem.ncbi.nlm.nih.gov/pug/pugsoap.cgi?wsdl
  baseURL: https://pubchem.ncbi.nlm.nih.gov/pug/pugsoap.cgi
  tags:
  - SOAP
  - Legacy
  - Structure Search
  - Chemical Standardization
  properties:
  - type: Documentation
    url: https://pubchem.ncbi.nlm.nih.gov/docs/pug-soap
  - type: WSDL
    url: https://pubchem.ncbi.nlm.nih.gov/pug/pugsoap.cgi?wsdl
  contact:
  - FN: PubChem Help Desk
    email: pubchem-help@ncbi.nlm.nih.gov
- name: PubChem Structure Image Service
  description: >-
    Generates 2D and 3D structure images for chemical compounds by CID, SID, SMILES, or InChI. Returns
    PNG images at configurable sizes, suitable for embedding in applications and documents.
  humanURL: https://pubchem.ncbi.nlm.nih.gov/docs/pug-rest#section=PNG
  baseURL: https://pubchem.ncbi.nlm.nih.gov/rest/pug
  tags:
  - Structure Images
  - 2D Structures
  - Visualization
  properties:
  - type: Documentation
    url: https://pubchem.ncbi.nlm.nih.gov/docs/pug-rest#section=PNG
  contact:
  - FN: PubChem Help Desk
    email: pubchem-help@ncbi.nlm.nih.gov
  operations:
  - summary: Get compound 2D structure image by CID
    method: GET
    path: /compound/cid/{cid}/PNG
    description: >-
      Returns a PNG image of the 2D chemical structure for the given compound ID. Size can be controlled
      with the image_size parameter.
  - summary: Get compound image by name
    method: GET
    path: /compound/name/{name}/PNG
    description: Returns a PNG image of the 2D chemical structure for a compound looked up by name.
  - summary: Get compound image by SMILES
    method: GET
    path: /compound/smiles/{smiles}/PNG
    description: >-
      Returns a PNG image of the 2D chemical structure for the compound specified by SMILES string.
- name: PubChem Identifier Exchange Service
  description: >-
    Bulk identifier conversion service for translating between PubChem CIDs, SIDs, and external identifiers
    such as CAS Registry Numbers, ChEMBL IDs, ChEBI IDs, and other registry identifiers at scale.
  humanURL: https://pubchem.ncbi.nlm.nih.gov/idexchange/idexchange.cgi
  baseURL: https://pubchem.ncbi.nlm.nih.gov/idexchange
  tags:
  - Identifier Conversion
  - CAS Numbers
  - ChEMBL
  - ChEBI
  - Registry IDs
  properties:
  - type: Documentation
    url: https://pubchem.ncbi.nlm.nih.gov/docs/identifier-exchange-service
  contact:
  - FN: PubChem Help Desk
    email: pubchem-help@ncbi.nlm.nih.gov
